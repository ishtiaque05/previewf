<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Containers — previewf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/style.css">
    <script>
    (function(){var t=localStorage.getItem('previewf-theme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();
    </script>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-left">
            <a class="logo" href="/">previewf</a>
        </div>
        <div class="top-bar-right">
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                <span class="theme-icon-light">&#9728;</span>
                <span class="theme-icon-dark">&#9790;</span>
            </button>
        </div>
    </header>
    <main class="docker-dashboard">
        <div class="docker-dashboard-header">
            <h1 class="docker-dashboard-title">&#128051; Containers</h1>
            <button id="docker-refresh" class="docker-refresh" aria-label="Refresh containers">&#8635;</button>
        </div>
        <div class="docker-search-wrap">
            <input id="docker-search" class="docker-search" type="text" placeholder="Search containers by name or image..." aria-label="Search containers" autofocus>
        </div>
        <div id="docker-list" class="docker-list"></div>
    </main>
    <footer class="status-bar">
        <span>previewf v0.2.0</span>
        <span class="status-separator">&middot;</span>
        <span>docker dashboard</span>
    </footer>
    <script src="/assets/app.js"></script>
</body>
</html>
