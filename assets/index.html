<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{directory}} — previewf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-left">
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
                <span class="nav-toggle-icon">&#9776;</span>
            </button>
            <a class="logo" href="/">previewf</a>
        </div>
        <div class="top-bar-right">
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                <span class="theme-icon-light">&#9728;</span>
                <span class="theme-icon-dark">&#9790;</span>
            </button>
        </div>
    </header>
    <div class="app-layout">
        <nav class="nav-sidebar" id="nav-sidebar">
            <div class="nav-sidebar-header">
                <span class="nav-sidebar-title">Files</span>
            </div>
            <div class="nav-tree" id="nav-tree"></div>
        </nav>
        <main class="main-content">
            {{breadcrumbs}}
            <div class="listing">
                <div class="file-list">
                    {{file_entries}}
                </div>
                <div class="listing-summary">
                    {{summary}}
                </div>
                <div id="docker-section" class="docker-section" style="display:none">
                    <div class="docker-header">
                        <h2 class="docker-section-title">Containers</h2>
                        <button id="docker-refresh" class="docker-refresh" aria-label="Refresh containers">&#8635;</button>
                    </div>
                    <div class="docker-search-wrap">
                        <input id="docker-search" class="docker-search" type="text" placeholder="Filter containers..." aria-label="Filter containers">
                    </div>
                    <div id="docker-list" class="docker-list"></div>
                </div>
            </div>
        </main>
    </div>
    <footer class="status-bar">
        <span>previewf v0.1.0</span>
        <span class="status-separator">&middot;</span>
        <span>directory listing</span>
    </footer>
    <script src="/assets/app.js"></script>
</body>
</html>
